<div x-data="{
  tabId:    '{{ tab_id }}',
  usercodi: '',
  buscando: false,
  usuario:  null,
  userError: '',
  rows:     [],
  original: null,
  guardando: false,
  errorMsg: '',
  async buscarUsuario() {
    this.userError = '';
    this.usuario   = null;
    this.rows      = [];
    this.original  = null;
    this.errorMsg  = '';
    const uc = this.usercodi.trim().toUpperCase();
    if (!uc) return;
    this.usercodi = uc;
    this.buscando = true;
    try {
      const url  = '/lina542/permisos?usercodi=' + encodeURIComponent(uc)
                 + '&_tab=' + encodeURIComponent(this.tabId);
      const resp = await fetch(url);
      const data = await resp.json().catch(() => ({}));
      if (!data.ok) {
        this.userError = data.error || 'Error al buscar usuario.';
        this.$nextTick(() => { if (this.$refs.inputUser) this.$refs.inputUser.focus(); });
      } else {
        this.usuario  = { usercodi: uc, username: data.username };
        this.rows     = data.permisos;
        this.original = JSON.stringify(data.permisos);
        this.$nextTick(() => {
          const c = this.$root.querySelector('.perm-cell');
          if (c) c.focus();
        });
      }
    } catch(_e) {
      this.userError = 'Error de comunicacion con el servidor.';
    } finally {
      this.buscando = false;
    }
  },

  toggle(idx, field) {
    this.rows[idx][field] = !this.rows[idx][field];
  },

  cellKey(e, idx, field) {
    if (e.key === 'x' || e.key === 'X')                { e.preventDefault(); this.rows[idx][field] = true;  return; }
    if (e.key === 'Delete' || e.key === 'Backspace')   { e.preventDefault(); this.rows[idx][field] = false; return; }
    if (e.key === ' ' || e.key === 'Enter')            { e.preventDefault(); this.toggle(idx, field); }
  },

  escapeEnGrid(e) {
    e.stopPropagation();
    this.$nextTick(() => { if (this.$refs.btnGuardar) this.$refs.btnGuardar.focus(); });
  },

  async guardar() {
    this.guardando = true;
    this.errorMsg  = '';
    try {
      const resp = await fetch('/lina542/guardar', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', 'X-Tab-Id': this.tabId },
        body:    JSON.stringify({ usercodi: this.usuario.usercodi, rows: this.rows }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!data.ok) {
        this.errorMsg = data.error || 'Error al guardar.';
        this.$nextTick(() => { if (this.$refs.btnGuardar) this.$refs.btnGuardar.focus(); });
      } else {
        this.original = JSON.stringify(this.rows);
        this.$nextTick(() => {
          const c = this.$root.querySelector('.perm-cell');
          if (c) c.focus();
        });
      }
    } catch(_e) {
      this.errorMsg = 'Error de comunicacion con el servidor.';
    } finally {
      this.guardando = false;
    }
  },

  corregir() {
    this.errorMsg = '';
    this.$nextTick(() => {
      const c = this.$root.querySelector('.perm-cell');
      if (c) c.focus();
    });
  },

  cancelar() {
    if (!this.hayCambios) {
      const mgr = window.linaTabsManager;
      if (mgr) mgr.closeTab(this.tabId);
      return;
    }
    if (this.original !== null) this.rows = JSON.parse(this.original);
    this.errorMsg = '';
    this.$nextTick(() => {
      const c = this.$root.querySelector('.perm-cell');
      if (c) c.focus();
    });
  },

  get hayDatos()   { return this.usuario !== null; },
  get hayCambios() { return this.original !== null && JSON.stringify(this.rows) !== this.original; }
}"
style="font-family: Arial; font-size: 9pt; padding: 16px 20px; display: flex; flex-direction: column; height: 100%; box-sizing: border-box;">

  <h3 style="font-size: 11pt; margin: 0 0 12px;">Editar Permisos</h3>

  {% if not perms or not perms.cons %}
  <p style="color: #b45309; font-size: 8pt;">Sin permiso de consulta.</p>
  {% else %}

  <!-- ── BUSCAR USUARIO ── -->
  <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 4px;">
    <label style="font-size: 8pt; white-space: nowrap;">
      Usuario <span style="color:#9ca3af;font-size:7.5pt;">(F4)</span>
    </label>
    <input type="text" x-ref="inputUser" x-model="usercodi"
           @keydown.enter.prevent="buscarUsuario()"
           @keydown.escape="if(!hayDatos){ $event.stopPropagation(); }"
           @change="buscarUsuario()"
           autocomplete="off" maxlength="32"
           data-selector-tabla="linauser"
           data-selector-campo-cod="usercodi"
           data-selector-campo-desc="username"
           data-selector-titulo="Buscar Usuario"
           style="width: 32ch; padding: 3px 6px; border: 1px solid #d1d5db;
                  border-radius: 4px; font-size: 9pt; text-transform: uppercase;">
    <span x-show="usuario" style="font-size: 8.5pt; color: #374151;"
          x-text="usuario ? usuario.username : ''"></span>
  </div>
  <div x-show="userError" style="font-size: 8pt; color: #b91c1c; margin-bottom: 6px;"
       x-text="userError"></div>

  <!-- ── GRILLA ── -->
  <template x-if="hayDatos">
    <div style="display: flex; flex-direction: column; flex: 1; min-height: 0; margin-top: 8px; max-width: 560px;">

      <!-- cabecera fija -->
      <div style="display: grid;
                  grid-template-columns: 9ch 1fr 4.5ch 4.5ch 4.5ch 4.5ch;
                  background: #374151; color: white; font-size: 8pt; font-weight: bold;
                  border-radius: 4px 4px 0 0; padding: 4px 0;">
        <div style="padding: 0 6px;">Código</div>
        <div style="padding: 0 6px;">Descripción</div>
        <div style="text-align: center;">Alta</div>
        <div style="text-align: center;">Baja</div>
        <div style="text-align: center;">Modi</div>
        <div style="text-align: center;">Cons</div>
      </div>

      <!-- cuerpo scroll -->
      <div style="overflow-y: auto; flex: 1; border: 1px solid #d1d5db; border-top: none;
                  border-radius: 0 0 4px 4px;"
           @keydown.escape="escapeEnGrid($event)">
        <template x-for="(row, idx) in rows" :key="row.progcodi">
          <div :style="`display:grid;grid-template-columns:9ch 1fr 4.5ch 4.5ch 4.5ch 4.5ch;background:${idx%2===0?'#fff':'#f9fafb'}`">
            <div style="padding: 3px 6px; font-size: 8pt; border-right: 1px solid #e5e7eb;"
                 x-text="row.progcodi"></div>
            <div style="padding: 3px 6px; font-size: 8pt; border-right: 1px solid #e5e7eb;
                        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                 x-text="row.progdesc"></div>
            <div class="perm-cell" tabindex="0"
                 @click="toggle(idx, 'safealta')"
                 @keydown="cellKey($event, idx, 'safealta')"
                 style="text-align: center; padding: 3px 0; cursor: pointer;
                        border-right: 1px solid #e5e7eb; font-size: 9pt; font-weight: bold; outline: none;"
                 :style="row.safealta ? 'color:#16a34a' : 'color:transparent'"
                 @focus="$el.style.outline='2px solid #3b82f6'"
                 @blur="$el.style.outline='none'"
                 x-text="row.safealta ? 'X' : '-'"></div>
            <div class="perm-cell" tabindex="0"
                 @click="toggle(idx, 'safebaja')"
                 @keydown="cellKey($event, idx, 'safebaja')"
                 style="text-align: center; padding: 3px 0; cursor: pointer;
                        border-right: 1px solid #e5e7eb; font-size: 9pt; font-weight: bold; outline: none;"
                 :style="row.safebaja ? 'color:#16a34a' : 'color:transparent'"
                 @focus="$el.style.outline='2px solid #3b82f6'"
                 @blur="$el.style.outline='none'"
                 x-text="row.safebaja ? 'X' : '-'"></div>
            <div class="perm-cell" tabindex="0"
                 @click="toggle(idx, 'safemodi')"
                 @keydown="cellKey($event, idx, 'safemodi')"
                 style="text-align: center; padding: 3px 0; cursor: pointer;
                        border-right: 1px solid #e5e7eb; font-size: 9pt; font-weight: bold; outline: none;"
                 :style="row.safemodi ? 'color:#16a34a' : 'color:transparent'"
                 @focus="$el.style.outline='2px solid #3b82f6'"
                 @blur="$el.style.outline='none'"
                 x-text="row.safemodi ? 'X' : '-'"></div>
            <div class="perm-cell" tabindex="0"
                 @click="toggle(idx, 'safecons')"
                 @keydown="cellKey($event, idx, 'safecons')"
                 style="text-align: center; padding: 3px 0; cursor: pointer;
                        font-size: 9pt; font-weight: bold; outline: none;"
                 :style="row.safecons ? 'color:#16a34a' : 'color:transparent'"
                 @focus="$el.style.outline='2px solid #3b82f6'"
                 @blur="$el.style.outline='none'"
                 x-text="row.safecons ? 'X' : '-'"></div>
          </div>
        </template>
      </div>

      <!-- ── BOTONES ── -->
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
        {% if perms and perms.modi %}
        <button type="button" x-ref="btnGuardar" @click="guardar()" :disabled="guardando"
                style="padding: 5px 16px; background: #2563eb; color: white;
                       border: none; border-radius: 4px; cursor: pointer; font-size: 9pt;"
                :style="guardando ? 'opacity:.6;cursor:not-allowed' : ''">
          Guardar
        </button>
        {% endif %}
        <button type="button" @click="corregir()"
                style="padding: 5px 16px; background: #6b7280; color: white;
                       border: none; border-radius: 4px; cursor: pointer; font-size: 9pt;">
          Corregir
        </button>
        <button type="button" @click="cancelar()"
                style="padding: 5px 16px; background: #6b7280; color: white;
                       border: none; border-radius: 4px; cursor: pointer; font-size: 9pt;">
          Cancelar
        </button>
        <span x-show="hayCambios && !guardando"
              style="font-size: 7.5pt; color: #b45309; font-style: italic;">
          Hay cambios sin guardar
        </span>
        <span x-show="guardando"
              style="font-size: 7.5pt; color: #6b7280; font-style: italic;">
          Guardando...
        </span>
      </div>

      <!-- error -->
      <div x-show="errorMsg" style="margin-top: 6px; font-size: 8pt; color: #b91c1c;"
           x-text="errorMsg"></div>

    </div>
  </template>

  {% endif %}
</div>
