<div x-data="{
  passActual:   '',
  passNueva:    '',
  passConfirma: '',
  showPass:     false,
  enviando:     false,
  resultado:    null,
  errorMsg:     '',

  get confirmaMismatch() {
    return this.passConfirma && this.passNueva && this.passConfirma !== this.passNueva;
  },

  get puedeEnviar() {
    return this.passActual && this.passNueva && this.passConfirma
           && !this.confirmaMismatch && !this.enviando;
  },

  async cambiar() {
    this.enviando  = true;
    this.errorMsg  = '';
    this.resultado = null;
    try {
      const form = new FormData();
      form.append('pass_actual',   this.passActual);
      form.append('pass_nueva',    this.passNueva);
      form.append('pass_confirma', this.passConfirma);
      form.append('_tab',          '{{ tab_id }}');

      const resp    = await fetch('/lina542/change', { method: 'POST', body: form });
      const payload = await resp.json().catch(() => ({}));
      if (!resp.ok || !payload.ok) {
        this.errorMsg = payload.error || 'Error al cambiar la contraseña.';
      } else {
        this.resultado   = payload.message;
        this.passActual  = '';
        this.passNueva   = '';
        this.passConfirma = '';
      }
    } catch (_err) {
      this.errorMsg = 'Error de comunicación con el servidor.';
    } finally {
      this.enviando = false;
    }
  }
}" style="font-family: Arial; font-size: 9pt; padding: 20px; max-width: 480px;">

  <h3 style="font-size: 11pt; margin-bottom: 16px;">Cambio de Contraseña</h3>
  <div style="font-size: 8pt; color: #6b7280; margin-bottom: 16px;">
    Usuario: <strong>{{ user }}</strong>
  </div>

  {# Trampa para autorrelleno del navegador #}
  <input type="text"     style="display:none" tabindex="-1" autocomplete="username">
  <input type="password" style="display:none" tabindex="-1" autocomplete="current-password">

  <!-- Resultado exitoso -->
  <template x-if="resultado">
    <div style="background: #d1fae5; border: 1px solid #10b981; border-radius: 4px;
                padding: 12px 16px; font-size: 8.5pt; color: #065f46;"
         x-text="resultado">
    </div>
  </template>

  <!-- Formulario -->
  <template x-if="!resultado">
    <div>
      <!-- Contraseña actual -->
      <div style="margin-bottom: 12px;">
        <label style="display: block; font-weight: bold; margin-bottom: 4px;">
          Contraseña actual
        </label>
        <input :type="showPass ? 'text' : 'password'"
               x-model="passActual"
               maxlength="64"
               autocomplete="current-password"
               data-lpignore="true"
               style="width: calc(30ch + 1.5rem); padding: 4px 6px; border: 1px solid #d1d5db;
                      border-radius: 4px; font-size: 9pt;">
      </div>

      <div style="border-top: 1px solid #e5e7eb; margin: 14px 0 12px;"></div>

      <!-- Nueva contraseña -->
      <div style="margin-bottom: 12px;">
        <label style="display: block; font-weight: bold; margin-bottom: 4px;">
          Nueva contraseña
        </label>
        <div style="display: flex; gap: 6px; align-items: center;">
          <input :type="showPass ? 'text' : 'password'"
                 x-model="passNueva"
                 maxlength="64"
                 autocomplete="new-password"
                 data-lpignore="true"
                 style="width: calc(30ch + 1.5rem); padding: 4px 6px; border: 1px solid #d1d5db;
                        border-radius: 4px; font-size: 9pt;">
          <button type="button" tabindex="-1"
                  @click="showPass = !showPass"
                  style="padding: 3px 8px; border: 1px solid #d1d5db; border-radius: 4px;
                         background: white; cursor: pointer; font-size: 8pt;"
                  :title="showPass ? 'Ocultar contraseñas' : 'Mostrar contraseñas'">
            <span x-text="showPass ? '🙈' : '👁'"></span>
          </button>
        </div>
        <div style="font-size: 7.5pt; color: #6b7280; margin-top: 4px; line-height: 1.5;">
          Mínimo 8 caracteres · Al menos 3 de 4 grupos: mayúsculas, minúsculas, números, símbolos
          · No puede ser igual al código de usuario
        </div>
      </div>

      <!-- Confirmar nueva contraseña -->
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: bold; margin-bottom: 4px;">
          Confirmar nueva contraseña
        </label>
        <input :type="showPass ? 'text' : 'password'"
               x-model="passConfirma"
               maxlength="64"
               autocomplete="new-password"
               data-lpignore="true"
               style="width: calc(30ch + 1.5rem); padding: 4px 6px;
                      border-radius: 4px; font-size: 9pt;"
               :style="confirmaMismatch
                 ? 'border: 1px solid #ef4444;'
                 : 'border: 1px solid #d1d5db;'">
        <template x-if="confirmaMismatch">
          <div style="font-size: 7.5pt; color: #dc2626; margin-top: 3px;">
            Las contraseñas no coinciden.
          </div>
        </template>
      </div>

      <!-- Error -->
      <template x-if="errorMsg">
        <div style="background: #fee2e2; border: 1px solid #ef4444; border-radius: 4px;
                    padding: 8px 12px; margin-bottom: 12px; font-size: 8.5pt; color: #991b1b;"
             x-text="errorMsg">
        </div>
      </template>

      <!-- Botones -->
      <div style="display: flex; gap: 8px; align-items: center;">
        <button type="button" @click="cambiar()"
                :disabled="!puedeEnviar"
                style="padding: 6px 18px; background: #2563eb; color: white;
                       border: none; border-radius: 4px; cursor: pointer; font-size: 9pt;"
                :style="!puedeEnviar ? 'opacity:0.5; cursor:not-allowed;' : ''">
          Cambiar contraseña
        </button>
        <span x-show="enviando" style="color: #6b7280; font-style: italic; font-size: 8.5pt;">
          Procesando...
        </span>
      </div>
    </div>
  </template>

</div>
