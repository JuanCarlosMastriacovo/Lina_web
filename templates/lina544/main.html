<script type="application/json" id="lina544-opts">{{ options | tojson }}</script>
<div x-data="{
  orig: { empr: '', user: '', userName: '' },
  dest: { empr: '', user: '', userName: '' },
  confirmando: false,
  ejecutando:  false,
  errorMsg:    '',

  options: JSON.parse(document.getElementById('lina544-opts').textContent),

  async resolveUser(side) {
    const s = this[side];
    if (!s.user || !s.empr) { s.userName = ''; return; }
    s.user = s.user.toUpperCase();
    const resp  = await fetch('/lina544/users');
    const items = await resp.json().catch(() => []);
    const found = items.find(i => i.empr === s.empr && i.code === s.user);
    s.userName = found ? found.name : '(usuario no encontrado)';
  },

  onEmprChange(side) {
    this[side].user     = '';
    this[side].userName = '';
  },

  get puedeEjecutar() {
    return this.orig.empr && this.orig.user && this.dest.empr && this.dest.user && !this.ejecutando;
  },

  solicitarConfirmacion() {
    this.errorMsg = '';
    this.confirmando = true;
  },

  cancelar() {
    this.confirmando = false;
  },

  resetForm() {
    this.orig        = { empr: '', user: '', userName: '' };
    this.dest        = { empr: '', user: '', userName: '' };
    this.confirmando = false;
    this.ejecutando  = false;
    this.errorMsg    = '';
    this.$nextTick(() => { if (this.$refs.origEmpr) this.$refs.origEmpr.focus(); });
  },

  handleEscape(e) {
    if (this.confirmando) { this.cancelar(); e.stopPropagation(); return; }
    if (document.activeElement !== this.$refs.origEmpr) { e.stopPropagation(); }
    // si foco en origEmpr: no stopPropagation → sube al handler global → cierra tab
  },

  async ejecutar() {
    this.confirmando = false;
    this.ejecutando  = true;
    this.errorMsg    = '';
    try {
      const form = new FormData();
      form.append('orig_empr', this.orig.empr);
      form.append('orig_user', this.orig.user);
      form.append('dest_empr', this.dest.empr);
      form.append('dest_user', this.dest.user);
      form.append('_tab',      '{{ tab_id }}');

      const resp    = await fetch('/lina544/ejecutar', { method: 'POST', body: form });
      const payload = await resp.json().catch(() => ({}));
      if (!resp.ok || !payload.ok) {
        this.errorMsg = payload.error || 'Error al ejecutar.';
      } else {
        this.resetForm();
      }
    } catch (_err) {
      this.errorMsg = 'Error de comunicacion con el servidor.';
    } finally {
      this.ejecutando = false;
    }
  }
}"
@keydown.escape="handleEscape($event)"
style="font-family: Arial; font-size: 9pt; padding: 20px; max-width: 560px;">

  <h3 style="font-size: 11pt; margin-bottom: 16px;">Copia de Permisos</h3>

  {% if not perms or not perms.modi %}
  <p style="color: #b45309; font-size: 8pt;">Sin permiso de modificacion para ejecutar esta operacion.</p>
  {% else %}

  <div>

      <!-- ── ORIGEN / DESTINO (grid 3 columnas) ────────────────── -->
      <div style="display: grid; grid-template-columns: 52px 1fr 1fr; gap: 18px 12px;
                  align-items: start; margin-bottom: 16px;">

        <!-- cabeceras -->
        <div></div>
        <div style="font-size: 7.5pt; color: #6b7280; padding-bottom: 2px;">Empresa</div>
        <div style="font-size: 7.5pt; color: #6b7280; padding-bottom: 2px;">
          Usuario <span style="color: #b0b7c0;">[F4]</span>
        </div>

        <!-- ── fila ORIGEN ── -->
        <div style="font-weight: bold; font-size: 8.5pt; padding-top: 4px;">Origen</div>

        <div>
          <select x-model="orig.empr" x-ref="origEmpr" @change="onEmprChange('orig')"
                  style="width: 100%; padding: 4px 6px; border: 1px solid #d1d5db;
                         border-radius: 4px; font-size: 9pt;">
            <option value="">- elegir -</option>
            <template x-for="o in options" :key="o.code">
              <option :value="o.code" x-text="o.code + ' - ' + o.name"></option>
            </template>
          </select>
        </div>

        <div>
          <div style="display: flex; gap: 4px;">
            <input type="text" x-model="orig.user" x-ref="origUser"
                   @input="orig.user = orig.user.toUpperCase(); orig.userName = ''"
                   @blur="resolveUser('orig')"
                   @change="resolveUser('orig')"
                   autocomplete="off"
                   data-selector-tabla="linauser"
                   data-selector-campo-cod="usercodi"
                   data-selector-campo-desc="username"
                   data-selector-titulo="Buscar Usuario (Origen)"
                   style="flex: 1; min-width: 0; padding: 4px 6px; border: 1px solid #d1d5db;
                          border-radius: 4px; font-size: 9pt; text-transform: uppercase;">
          </div>
          <div style="font-size: 7.5pt; color: #6b7280; min-height: 14px; margin-top: 2px;"
               x-text="orig.userName"></div>
        </div>

        <!-- separador visual -->
        <div style="grid-column: 1 / -1; border-top: 1px solid #e5e7eb; margin: 4px 0;"></div>

        <!-- ── fila DESTINO ── -->
        <div style="font-weight: bold; font-size: 8.5pt; padding-top: 4px;">Destino</div>

        <div>
          <select x-model="dest.empr" @change="onEmprChange('dest')"
                  style="width: 100%; padding: 4px 6px; border: 1px solid #d1d5db;
                         border-radius: 4px; font-size: 9pt;">
            <option value="">- elegir -</option>
            <template x-for="o in options" :key="o.code">
              <option :value="o.code" x-text="o.code + ' - ' + o.name"></option>
            </template>
          </select>
        </div>

        <div>
          <div style="display: flex; gap: 4px;">
            <input type="text" x-model="dest.user" x-ref="destUser"
                   @input="dest.user = dest.user.toUpperCase(); dest.userName = ''"
                   @blur="resolveUser('dest')"
                   @change="resolveUser('dest')"
                   autocomplete="off"
                   data-selector-tabla="linauser"
                   data-selector-campo-cod="usercodi"
                   data-selector-campo-desc="username"
                   data-selector-titulo="Buscar Usuario (Destino)"
                   style="flex: 1; min-width: 0; padding: 4px 6px; border: 1px solid #d1d5db;
                          border-radius: 4px; font-size: 9pt; text-transform: uppercase;">
          </div>
          <div style="font-size: 7.5pt; color: #6b7280; min-height: 14px; margin-top: 2px;"
               x-text="dest.userName"></div>
        </div>

      </div>

      <!-- ── CONFIRMACION ─────────────────────────────────────── -->
      <template x-if="confirmando">
        <div style="background: #fef3c7; border: 1px solid #f59e0b; border-radius: 4px;
                    padding: 10px 14px; margin-bottom: 12px; font-size: 8.5pt;">
          <strong>Confirma copiar los permisos?</strong><br>
          <span style="color: #374151;">
            De: <strong x-text="orig.user"></strong> (<span x-text="orig.empr"></span>)
            &rarr;
            A: <strong x-text="dest.user"></strong> (<span x-text="dest.empr"></span>)
          </span>
          <div style="display: flex; gap: 8px; margin-top: 10px;">
            <button type="button" @click="ejecutar()"
                    style="padding: 5px 14px; background: #2563eb; color: white;
                           border: none; border-radius: 4px; cursor: pointer; font-size: 8.5pt;">
              Confirmar
            </button>
            <button type="button" @click="cancelar()"
                    style="padding: 5px 14px; background: #6b7280; color: white;
                           border: none; border-radius: 4px; cursor: pointer; font-size: 8.5pt;">
              Cancelar
            </button>
          </div>
        </div>
      </template>

      <!-- ── ERROR ────────────────────────────────────────────── -->
      <template x-if="errorMsg">
        <div style="background: #fee2e2; border: 1px solid #ef4444; border-radius: 4px;
                    padding: 8px 12px; margin-bottom: 12px; font-size: 8.5pt; color: #991b1b;"
             x-text="errorMsg">
        </div>
      </template>

      <!-- ── BOTON PRINCIPAL ──────────────────────────────────── -->
      <template x-if="!confirmando">
        <div style="display: flex; align-items: center; gap: 10px;">
          <button type="button" @click="solicitarConfirmacion()"
                  :disabled="!puedeEjecutar"
                  style="padding: 6px 18px; background: #2563eb; color: white;
                         border: none; border-radius: 4px; cursor: pointer; font-size: 9pt;"
                  :style="!puedeEjecutar ? 'opacity:0.5; cursor:not-allowed;' : ''">
            Copiar permisos
          </button>
          <span x-show="ejecutando"
                style="color: #6b7280; font-style: italic; font-size: 8.5pt;">
            Procesando...
          </span>
        </div>
      </template>

    </div>

  {% endif %}
</div>
